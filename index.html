<!doctype html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FileFly - النقل السريع للملفات عبر الشبكة المحلية</title>
    
    <!-- Google Fonts: Tajawal (Loaded asynchronously to prevent any blank screen render delay) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    </noscript>
    
    <!-- Favicon & PWA meta -->
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FileFly">
    
    <style>
      /* Prevent text selection and unwanted drag defaults */
      html, body {
        background-color: #020617;
        color: #f8fafc;
        user-select: none;
        -webkit-user-select: none;
        overflow-x: hidden;
        margin: 0;
        padding: 0;
      }
      @keyframes pulseSlow {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(0.96); }
      }
      .instant-loader {
        animation: pulseSlow 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen selection:bg-brand-500 selection:text-white">
    <div id="root">
      <!-- Instant Zero-Delay Splash Screen for Mobile & Desktop -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #020617; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif;">
        <div class="instant-loader" style="position: relative; display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 20px; background: linear-gradient(135deg, #0284c7, #0ea5e9, #38bdf8); padding: 2px; box-shadow: 0 0 35px rgba(14, 165, 233, 0.35); margin-bottom: 16px;">
          <div style="width: 100%; height: 100%; background: #020617; border-radius: 18px; display: flex; align-items: center; justify-content: center;">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="#38bdf8" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
          </div>
        </div>
        <div style="font-size: 20px; font-weight: 800; letter-spacing: 0.05em; color: #ffffff; margin-bottom: 6px;">FileFly</div>
        <div style="font-size: 12px; color: #64748b;">جاري التحميل...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
