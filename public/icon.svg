<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rich Vibrant Modern Gradient -->
    <linearGradient id="mainBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#0ea5e9" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Top glossy sheen for 3D depth -->
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Soft Depth Shadow for Bolt -->
    <filter id="boltShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0c2340" flood-opacity="0.45" />
    </filter>

    <!-- Bolt Crisp Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>
  </defs>

  <!-- Main Squircle Card (Clean smooth edge with zero halo fringing) -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#mainBgGrad)" />

  <!-- Top Glass Sheen Layer -->
  <rect x="20" y="20" width="472" height="236" rx="112" fill="url(#sheenGrad)" clip-path="url(#topHalfClip)" />

  <!-- Top Half Clip for Sheen -->
  <clipPath id="topHalfClip">
    <rect x="20" y="20" width="472" height="236" rx="112" />
  </clipPath>

  <!-- Crisp Modern Lightning Bolt (Iconic FileFly Symbol) -->
  <polygon points="280 64 88 296 244 296 232 448 424 216 268 216 280 64"
           fill="url(#boltGrad)"
           filter="url(#boltShadow)"
           stroke="#ffffff"
           stroke-width="2"
           stroke-linejoin="round" />
</svg>
